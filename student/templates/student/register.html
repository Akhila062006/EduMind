
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduMind</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e9edff, #f5eaff);
        }

        .register-box {
            background: white;
            width: 380px;
            max-width: 92%;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #29245c20;
        }

        h1 {
            color: #5146c8;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 23px;
            padding: 13px;
            background: #6256d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #493eb7;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        a {
            color: #5146c8;
            text-decoration: none;
            font-weight: bold;
        }

        .errors {
            color: #d22;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h1>🎓 EduMind</h1>
    <p class="subtitle">Create your student account</p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password1" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" name="password2" placeholder="Confirm password" required>

        {% if error %}
            <p class="errors">{{ error }}</p>
        {% endif %}

        <button type="submit">Create Account</button>
    </form>

    <p class="bottom">
        Already have an account?
        <a href="/login/">Login</a>
    </p>
</div>

</body>
</html>
