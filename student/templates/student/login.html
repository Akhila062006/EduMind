
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduMind</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e9edff, #f5eaff);
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 92%;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #29245c20;
        }

        h1 {
            text-align: center;
            color: #5146c8;
        }

        p {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6256d9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #493eb7;
        }

        .bottom {
            margin-top: 22px;
        }

        a {
            color: #5146c8;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>🎓 EduMind</h1>
    <p>Welcome back! Login to continue.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}

        <button type="submit">Login</button>
    </form>

    <p class="bottom">
        Don't have an account?
        <a href="/register/">Register</a>
    </p>
</div>

</body>
</html>
